# Netlify Configuration File
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # No build command needed (static HTML)
  command = ""
  publish = "."

[dev]
  # Local development settings
  command = "python -m http.server 8000"
  port = 8000
  # Publish directory during development
  publish = "."

# Redirects for single-page application
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    # Security Headers
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Cache Control
    Cache-Control = "public, max-age=3600"
    
    # CORS (if needed)
    Access-Control-Allow-Origin = "*"

# Cache control for HTML
[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "max-age=0, no-cache, no-store, must-revalidate"

# Cache control for assets
[[headers]]
  for = "*.{js,css,svg,png,jpg,jpeg,gif,webp,woff,woff2}"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Environment variables (set in Netlify UI)
[context.production.environment]
  NODE_ENV = "production"

[context.deploy-preview.environment]
  NODE_ENV = "development"

[context.branch-deploy.environment]
  NODE_ENV = "development"

# Build plugins
# [[plugins]]
#   package = "@netlify/plugin-lighthouse"

# Deployment settings
[functions]
  # No serverless functions needed

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

# Notifications (optional - configure in UI)
# [[notifications]]
#   member_emails = ["your-email@example.com"]

# Context-specific settings
[context.production]
  command = ""
  publish = "."

[context."deploy-preview"]
  command = ""
  publish = "."

[context."branch-deploy"]
  command = ""
  publish = "."

# Ignore build (deploy only when specific files change)
# This tells Netlify to skip builds when only certain files are changed
# Uncomment to enable:
# [build]
#   ignore = "exit 0"
